name: Build PsyDroid
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build and test portable app
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PsyDroid-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
